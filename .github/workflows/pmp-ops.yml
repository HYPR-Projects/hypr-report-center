# Central de operações do PMP — diagnóstico e deploy, disparável por automação.
#
# Por que existe
# ─────────────
# O container de dev do Claude Code não alcança o GCP: a política de egresso da
# org bloqueia `*.cloudfunctions.net` e `*.googleapis.com` (403 no CONNECT do
# proxy, ver /root/.ccr/README.md). Consequência prática: o diagnóstico do
# pipeline virava um pedido de "roda essa query no BigQuery pra mim" — e
# ninguém abre o BQ pra conferir cron, então o conserto seguia sendo chute.
#
# Aqui o runner do GitHub tem credencial do site-hypr e alcança tudo. O que era
# pedido vira job com log legível.
#
# Os passos de diagnóstico usam `continue-on-error`: um pedaço que falha (um
# escopo de permissão faltando) não pode esconder os outros — o diagnóstico
# parcial vale mais que nenhum.

name: PMP ops (diagnóstico e deploy)

on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'O que rodar'
        type: choice
        default: diagnosticar
        options:
          - diagnosticar
          - deploy
          - diagnosticar-e-deploy
      sondar_agora:
        description: 'Sync PubMatic + auditoria ao final (prova viva do pipeline)'
        type: boolean
        default: true

concurrency:
  group: pmp-ops
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGION: southamerica-east1
  PROJECT: site-hypr
  FN_URL: https://southamerica-east1-site-hypr.cloudfunctions.net/report_data

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Conferir se há credencial configurada
        # Os valores vão por `env`, não interpolados no script: o JSON da
        # service account tem aspas e quebras de linha e produziria bash
        # inválido dentro de [ -n "..." ].
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$WIF_PROVIDER" ]; then
            echo "Auth: Workload Identity Federation"
          elif [ -n "$SA_KEY" ]; then
            echo "Auth: chave de service account"
          else
            echo "::error::Nenhuma credencial GCP configurada."
            echo "::error::Opção A: variáveis GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_DEPLOY_SERVICE_ACCOUNT"
            echo "::error::Opção B: secret GCP_SA_KEY com o JSON da service account"
            exit 1
          fi

      - name: Autenticar no GCP (Workload Identity Federation)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Autenticar no GCP (chave de service account)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: site-hypr

      # ── DIAGNÓSTICO ─────────────────────────────────────────────────────────

      # A pergunta que a "última execução" do painel não responde: o Cloud
      # Scheduler está DISPARANDO? Base velha por fonte lenta e base velha por
      # cron morto têm a mesma cara na tela e pedem consertos opostos.
      - name: 'Diagnóstico · estado dos Cloud Schedulers'
        if: inputs.acao != 'deploy'
        continue-on-error: true
        run: |
          for job in pmp-pubmatic-refresh pmp-xandr-daily-sync; do
            echo "── $job ──"
            gcloud scheduler jobs describe "$job" \
              --location="$REGION" --project="$PROJECT" \
              --format="yaml(name,state,schedule,timeZone,lastAttemptTime,scheduleTime,status)" \
              2>&1 || echo "  (job não existe — deploy pendente?)"
            echo
          done

      # O ledger sabe de tudo: se rodou, a que horas, com qual credencial, e
      # até que dia a fonte tinha dado em cada tentativa.
      - name: 'Diagnóstico · execuções do sync nas últimas 72h'
        if: inputs.acao != 'deploy'
        continue-on-error: true
        run: |
          bq query --project_id="$PROJECT" --use_legacy_sql=false --format=prettyjson \
          'SELECT
             FORMAT_TIMESTAMP("%d/%m %H:%M", started_at, "America/Sao_Paulo") AS quando_brt,
             source, status, actor, credential,
             CAST(api_last_day AS STRING) AS dado_ate,
             lag_days, rows_processed,
             SUBSTR(IFNULL(error, ""), 0, 120) AS erro
           FROM `site-hypr.prod_assets.pmp_sync_runs`
           WHERE started_at >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 72 HOUR)
           ORDER BY started_at DESC
           LIMIT 100'

      # A pergunta que faz todo schedule fixo ser palpite: A QUE HORAS a
      # PubMatic fecha D-1? Uma linha por dia, com a primeira hora em que o
      # dado de D-1 apareceu. Se convergir, o schedule pode ser apertado por
      # evidência; se variar, a janela larga está justificada.
      - name: 'Diagnóstico · a que horas a PubMatic fecha D-1'
        if: inputs.acao != 'deploy'
        continue-on-error: true
        run: |
          bq query --project_id="$PROJECT" --use_legacy_sql=false --format=prettyjson \
          'SELECT
             DATE(started_at, "America/Sao_Paulo") AS dia_brt,
             MIN(EXTRACT(HOUR FROM started_at AT TIME ZONE "America/Sao_Paulo")) AS primeira_hora_com_D1,
             COUNT(*) AS runs_no_dia
           FROM `site-hypr.prod_assets.pmp_sync_runs`
           WHERE source = "pubmatic" AND status = "ok"
             AND api_last_day = DATE_SUB(DATE(started_at, "America/Sao_Paulo"), INTERVAL 1 DAY)
             AND started_at >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 14 DAY)
           GROUP BY dia_brt
           ORDER BY dia_brt DESC'

      # Onde a base está AGORA, por fonte. Confere o que o painel mostra.
      - name: 'Diagnóstico · frescor da base por fonte'
        if: inputs.acao != 'deploy'
        continue-on-error: true
        run: |
          bq query --project_id="$PROJECT" --use_legacy_sql=false --format=prettyjson \
          'SELECT
             source,
             CAST(MAX(day) AS STRING) AS ultimo_dia_na_base,
             CAST(DATE_SUB(CURRENT_DATE("America/Sao_Paulo"), INTERVAL 1 DAY) AS STRING) AS d_menos_1,
             DATE_DIFF(DATE_SUB(CURRENT_DATE("America/Sao_Paulo"), INTERVAL 1 DAY), MAX(day), DAY) AS dias_atras,
             COUNT(DISTINCT line_id) AS lines
           FROM `site-hypr.prod_assets.pmp_line_delivery_daily`
           GROUP BY source
           ORDER BY source'

      # A tabela que a UI lê. `view_refreshed_at` é a prova de que o refresh
      # pós-sync rodou (e, desde a migração 003, de que o SQL com N tokens do
      # Command por line compila no BigQuery de verdade). As contagens de
      # tokens mostram quantas lines já usam a soma de PI.
      - name: 'Diagnóstico · pmp_lines_enriched (refresh e tokens do Command)'
        if: inputs.acao != 'deploy'
        continue-on-error: true
        run: |
          bq query --project_id="$PROJECT" --use_legacy_sql=false --format=prettyjson \
          'SELECT
             FORMAT_TIMESTAMP("%d/%m %H:%M", MAX(view_refreshed_at), "America/Sao_Paulo") AS refresh_brt,
             TIMESTAMP_DIFF(CURRENT_TIMESTAMP(), MAX(view_refreshed_at), MINUTE) AS refresh_ha_min,
             COUNT(*) AS lines,
             COUNTIF(linked_token_count >= 1) AS lines_com_token,
             COUNTIF(linked_token_count >= 2) AS lines_com_varios_tokens,
             COUNTIF(linked_token_count > linked_checklist_count) AS lines_com_token_sem_match,
             COUNTIF(pi_brl IS NOT NULL) AS lines_com_pi,
             ROUND(SUM(CAST(pi_brl AS FLOAT64)), 2) AS pi_total
           FROM `site-hypr.prod_assets.pmp_lines_enriched`'
          echo
          echo "── lines com mais de um token do Command ──"
          bq query --project_id="$PROJECT" --use_legacy_sql=false --format=prettyjson \
          'SELECT source, line_id, customer, campaign_name, linked_tokens,
                  linked_checklist_count, CAST(command_pi_total AS STRING) AS command_pi_total,
                  CAST(pi_brl AS STRING) AS pi_brl, pi_overridden
           FROM `site-hypr.prod_assets.pmp_lines_enriched`
           WHERE linked_token_count >= 2
           ORDER BY customer, line_id
           LIMIT 50'

      # ── DEPLOY ──────────────────────────────────────────────────────────────

      - uses: actions/setup-python@v5
        if: contains(inputs.acao, 'deploy')
        with:
          python-version: '3.11'

      - name: Instalar dependências
        if: contains(inputs.acao, 'deploy')
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r backend/requirements.txt -r backend/requirements-dev.txt

      # Gate de verdade: falhou, não publica.
      - name: Rodar a suíte de testes
        if: contains(inputs.acao, 'deploy')
        working-directory: backend
        run: python -m pytest tests/ -q

      # O deploy.sh é auto-suficiente: captura os secrets da revisão viva e
      # reconcilia os Cloud Schedulers de forma idempotente.
      - name: Deploy
        if: contains(inputs.acao, 'deploy')
        working-directory: backend
        run: bash deploy.sh

      - name: 'Smoke check (?action=healthz)'
        if: contains(inputs.acao, 'deploy')
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/health.txt -w '%{http_code}' --max-time 30 "$FN_URL?action=healthz" || echo 000)
            echo "tentativa $i → HTTP $code"
            if [ "$code" = "200" ]; then cat /tmp/health.txt; exit 0; fi
            sleep 10
          done
          echo "::error::healthz não respondeu 200 — verificar a revisão no Cloud Run"
          cat /tmp/health.txt || true
          exit 1

      # ── PROVA VIVA ──────────────────────────────────────────────────────────

      # Dispara um sync real e mostra o antes/depois do dia que a fonte tinha.
      # É a diferença entre "deployei" e "o pipeline funciona": `advanced=true`
      # significa que a fonte fechou um dia novo e nós capturamos.
      - name: 'Sondagem · sync PubMatic agora'
        if: inputs.sondar_agora
        continue-on-error: true
        run: |
          SECRET=$(gcloud secrets versions access latest \
            --secret=PMP_SCHEDULER_SECRET --project="$PROJECT" 2>/dev/null || echo "")
          if [ -z "$SECRET" ]; then
            echo "::warning::PMP_SCHEDULER_SECRET não acessível — pulando a sondagem"
            exit 0
          fi
          curl -sS -X POST --max-time 300 \
            -H "Content-Type: application/json" \
            -H "X-Scheduler-Secret: $SECRET" \
            "$FN_URL?action=pmp_sync_pubmatic" | python3 -m json.tool

      # Diff API × BQ: dias que a coleta perdeu, valores divergentes, rows
      # órfãs. Read-only — não conserta nada, classifica.
      - name: 'Auditoria · API da PubMatic × pmp_line_delivery_daily'
        if: inputs.sondar_agora
        continue-on-error: true
        run: |
          SECRET=$(gcloud secrets versions access latest \
            --secret=PMP_SCHEDULER_SECRET --project="$PROJECT" 2>/dev/null || echo "")
          if [ -z "$SECRET" ]; then
            echo "::warning::PMP_SCHEDULER_SECRET não acessível — pulando a auditoria"
            exit 0
          fi
          curl -sS --max-time 300 \
            -H "X-Scheduler-Secret: $SECRET" \
            "$FN_URL?action=pmp_pubmatic_audit&days=14" | python3 -m json.tool
