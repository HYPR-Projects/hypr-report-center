# Central de operações do PMP — diagnóstico e deploy, disparável por automação.
#
# Por que existe
# ─────────────
# O container de dev do Claude Code não alcança o GCP: a política de egresso da
# org bloqueia `*.cloudfunctions.net` e `*.googleapis.com` (403 no CONNECT do
# proxy, ver /root/.ccr/README.md). Consequência prática: o diagnóstico do
# pipeline virava um pedido de "roda essa query no BigQuery pra mim" — e
# ninguém abre o BQ pra conferir cron, então o conserto seguia sendo chute.
#
# Aqui o runner do GitHub tem credencial do site-hypr e alcança tudo. O que era
# pedido vira job com log legível.
#
# Os passos de diagnóstico usam `continue-on-error`: um pedaço que falha (um
# escopo de permissão faltando) não pode esconder os outros — o diagnóstico
# parcial vale mais que nenhum.

name: PMP ops (diagnóstico e deploy)

on:
  # Ronda diária às 09:30 BRT (12:30 UTC), só diagnóstico (sem inputs, nada de
  # deploy nem sondagem). O passo "Veredito" FALHA o job quando há buraco na
  # grade do cron, execução com erro nas últimas 24h ou a PubMatic parada em
  # D-2+ com deal entregando na semana — e o GitHub manda o e-mail de falha.
  # É o alarme que faltou em 19–21/08 e em 01–03/09: o painel só avisa quem
  # abre o painel.
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      acao:
        description: 'O que rodar'
        type: choice
        default: diagnosticar
        options:
          - diagnosticar
          - deploy
          - diagnosticar-e-deploy
      sondar_agora:
        description: 'Sync PubMatic + auditoria ao final (prova viva do pipeline)'
        type: boolean
        default: true
      sonda_api_crua:
        description: 'Chamar a API da PubMatic direto do runner e imprimir a resposta crua (ver backend/scripts/pubmatic_probe.py)'
        type: boolean
        default: false
      sonda_dias:
        description: 'Sonda crua: janela em dias (PROBE_DAYS); "completa" liga todas as variantes de request'
        type: string
        default: '6'
      sonda_completa:
        description: 'Sonda crua: rodar também as variantes de dimensão/endpoint (várias requests)'
        type: boolean
        default: true

concurrency:
  group: pmp-ops
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGION: southamerica-east1
  PROJECT: site-hypr
  FN_URL: https://southamerica-east1-site-hypr.cloudfunctions.net/report_data

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Conferir se há credencial configurada
        # Os valores vão por `env`, não interpolados no script: o JSON da
        # service account tem aspas e quebras de linha e produziria bash
        # inválido dentro de [ -n "..." ].
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$WIF_PROVIDER" ]; then
            echo "Auth: Workload Identity Federation"
          elif [ -n "$SA_KEY" ]; then
            echo "Auth: chave de service account"
          else
            echo "::error::Nenhuma credencial GCP configurada."
            echo "::error::Opção A: variáveis GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_DEPLOY_SERVICE_ACCOUNT"
            echo "::error::Opção B: secret GCP_SA_KEY com o JSON da service account"
            exit 1
          fi

      - name: Autenticar no GCP (Workload Identity Federation)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Autenticar no GCP (chave de service account)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: site-hypr

      # ── DIAGNÓSTICO ─────────────────────────────────────────────────────────

      # A pergunta que a "última execução" do painel não responde: o Cloud
      # Scheduler está DISPARANDO? Base velha por fonte lenta e base velha por
      # cron morto têm a mesma cara na tela e pedem consertos opostos.
      - name: 'Diagnóstico · estado dos Cloud Schedulers'
        if: inputs.acao != 'deploy'
        continue-on-error: true
        run: |
          for job in pmp-pubmatic-refresh pmp-xandr-daily-sync; do
            echo "── $job ──"
            gcloud scheduler jobs describe "$job" \
              --location="$REGION" --project="$PROJECT" \
              --format="yaml(name,state,schedule,timeZone,lastAttemptTime,scheduleTime,status)" \
              2>&1 || echo "  (job não existe — deploy pendente?)"
            echo
          done

      # (Não há passo de Cloud Logging aqui de propósito: a SA de deploy não
      # tem logging.logEntries.list — testado em 04/09, PERMISSION_DENIED. Um
      # passo que sempre falha vira ruído que se aprende a ignorar, e foi
      # exatamente assim que os `bq query` negados passaram despercebidos.)

      # O ledger sabe de tudo: se rodou, a que horas, com qual credencial, até
      # que dia a fonte tinha dado em cada tentativa, e (missing_slots) quais
      # horas da grade do cron NÃO dispararam. Vai pela função, e não por
      # `bq query`, porque a service account do CI não tem
      # bigquery.jobs.create — os três passos que faziam isso direto no BQ
      # falharam com Access Denied em TODOS os runs deste workflow, escondidos
      # pelo continue-on-error. A "auditoria" nunca tinha visto o ledger.
      #
      # Como ler:
      #   missing_slots vazio + api_last_day parado → a PubMatic ainda não
      #     reportou o dia (fonte); a base está igual à API (confira no passo
      #     de auditoria: clean=true).
      #   missing_slots com horas → o Cloud Scheduler não disparou (infra).
      #   runs com status error/skipped → credencial/API (o erro vem junto).
      #   d1_close_hours → a hora do dia em que a PubMatic fechou D-1, por dia.
      - name: 'Diagnóstico · ledger de execuções, grade do cron e frescor por fonte'
        if: inputs.acao != 'deploy'
        continue-on-error: true
        run: |
          SECRET=$(gcloud secrets versions access latest \
            --secret=PMP_SCHEDULER_SECRET --project="$PROJECT" 2>/dev/null || echo "")
          if [ -z "$SECRET" ]; then
            echo "::warning::PMP_SCHEDULER_SECRET não acessível — pulando"
            exit 0
          fi
          curl -sS --max-time 120 -o /tmp/status.json \
            -H "X-Scheduler-Secret: $SECRET" \
            "$FN_URL?action=pmp_sync_status&hours=72"
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/status.json"))
          if "error" in d and "runs" not in d:
              print(json.dumps(d, indent=2, ensure_ascii=False)); sys.exit(1)
          print("== PubMatic ==", json.dumps(d.get("pubmatic"), ensure_ascii=False))
          ms = d.get("missing_slots")
          print("== Horas da grade SEM disparo do scheduler (72h):", ms if ms else "nenhuma — cron em dia")
          print("== Frescor por fonte ==")
          for r in d.get("delivery_freshness") or []: print("  ", r)
          print("== A que hora a PubMatic fechou D-1 (por dia BRT) ==")
          for r in d.get("d1_close_hours") or []: print("  ", r)
          print("== Execuções (72h) ==")
          for r in d.get("runs") or []:
              print("  ", r.get("quando_brt"), r.get("source"), r.get("status"), r.get("actor"),
                    r.get("credential") or "", "dado_ate=" + str(r.get("api_last_day")),
                    "lag=" + str(r.get("lag_days")), "zeros=" + str(r.get("trailing_zero_days")),
                    "rows=" + str(r.get("rows_processed")), r.get("error") or "")
          for k in ("runs_error", "d1_close_hours_error", "delivery_freshness_error"):
              if d.get(k): print("::warning::" + k + ": " + d[k])
          PY

      # A tabela que a UI lê, via a própria função (a service account do CI
      # não tem bigquery.jobs.create, então `bq query` direto é negado aqui).
      # `view_refreshed_at` é a prova de que o refresh pós-sync rodou e, desde
      # a migração 003, de que o SQL com N tokens do Command por line compila
      # no BigQuery de verdade. As contagens mostram quantas lines já somam PI.
      - name: 'Diagnóstico · pmp_lines_enriched (refresh e tokens do Command)'
        if: inputs.acao != 'deploy'
        continue-on-error: true
        run: |
          SECRET=$(gcloud secrets versions access latest \
            --secret=PMP_SCHEDULER_SECRET --project="$PROJECT" 2>/dev/null || echo "")
          if [ -z "$SECRET" ]; then
            echo "::warning::PMP_SCHEDULER_SECRET não acessível — pulando"
            exit 0
          fi
          curl -sS --max-time 120 \
            -H "X-Scheduler-Secret: $SECRET" \
            "$FN_URL?action=pmp_enriched_status&limit=50" | python3 -m json.tool

      # ── DEPLOY ──────────────────────────────────────────────────────────────

      - uses: actions/setup-python@v5
        if: contains(inputs.acao, 'deploy')
        with:
          python-version: '3.11'

      - name: Instalar dependências
        if: contains(inputs.acao, 'deploy')
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r backend/requirements.txt -r backend/requirements-dev.txt

      # Gate de verdade: falhou, não publica.
      - name: Rodar a suíte de testes
        if: contains(inputs.acao, 'deploy')
        working-directory: backend
        run: python -m pytest tests/ -q

      # O deploy.sh é auto-suficiente: captura os secrets da revisão viva e
      # reconcilia os Cloud Schedulers de forma idempotente.
      - name: Deploy
        if: contains(inputs.acao, 'deploy')
        working-directory: backend
        run: bash deploy.sh

      - name: 'Smoke check (?action=healthz)'
        if: contains(inputs.acao, 'deploy')
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/health.txt -w '%{http_code}' --max-time 30 "$FN_URL?action=healthz" || echo 000)
            echo "tentativa $i → HTTP $code"
            if [ "$code" = "200" ]; then cat /tmp/health.txt; exit 0; fi
            sleep 10
          done
          echo "::error::healthz não respondeu 200 — verificar a revisão no Cloud Run"
          cat /tmp/health.txt || true
          exit 1

      # ── PROVA VIVA ──────────────────────────────────────────────────────────

      # Dispara um sync real e mostra o antes/depois do dia que a fonte tinha.
      # É a diferença entre "deployei" e "o pipeline funciona": `advanced=true`
      # significa que a fonte fechou um dia novo e nós capturamos.
      - name: 'Sondagem · sync PubMatic agora'
        if: inputs.sondar_agora
        continue-on-error: true
        run: |
          SECRET=$(gcloud secrets versions access latest \
            --secret=PMP_SCHEDULER_SECRET --project="$PROJECT" 2>/dev/null || echo "")
          if [ -z "$SECRET" ]; then
            echo "::warning::PMP_SCHEDULER_SECRET não acessível — pulando a sondagem"
            exit 0
          fi
          # max-time = timeout da função (540s) + folga. Era 300s e estourava
          # com 0 bytes — sem dizer se o sync tinha rodado. Agora, além do
          # tempo maior, a resposta traz `timings_sec` por etapa (ledger,
          # sync, refresh da enriched, compplan) pra apontar ONDE demorou.
          code=$(curl -sS -X POST --max-time 560 -o /tmp/sync.json -w '%{http_code}' \
            -H "Content-Type: application/json" \
            -H "X-Scheduler-Secret: $SECRET" \
            "$FN_URL?action=pmp_sync_pubmatic" || echo 000)
          echo "HTTP $code"
          python3 -m json.tool /tmp/sync.json || cat /tmp/sync.json || true
          if [ "$code" != "200" ]; then
            echo "::warning::sync não devolveu 200 — confira o ledger no passo seguinte (a row existe mesmo se o HTTP morreu)"
          fi

      # Mesmo que o curl acima tenha morrido, a row do ledger existe: mostra o
      # que a sondagem viu (api_last_day) e se a grade do cron está inteira.
      - name: 'Sondagem · ledger depois do sync'
        if: inputs.sondar_agora
        continue-on-error: true
        run: |
          SECRET=$(gcloud secrets versions access latest \
            --secret=PMP_SCHEDULER_SECRET --project="$PROJECT" 2>/dev/null || echo "")
          [ -z "$SECRET" ] && exit 0
          curl -sS --max-time 120 -H "X-Scheduler-Secret: $SECRET" \
            "$FN_URL?action=pmp_sync_status&hours=6" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          print("missing_slots (6h):", d.get("missing_slots"))
          for r in (d.get("runs") or [])[:8]:
              print("  ", r.get("quando_brt"), r.get("source"), r.get("status"), r.get("actor"),
                    "dado_ate=" + str(r.get("api_last_day")), "lag=" + str(r.get("lag_days")),
                    "dur=" + str(r.get("duration_sec")), r.get("error") or "")
          '

      # Diff API × BQ: dias que a coleta perdeu, valores divergentes, rows
      # órfãs. Read-only — não conserta nada, classifica.
      - name: 'Auditoria · API da PubMatic × pmp_line_delivery_daily'
        if: inputs.sondar_agora
        continue-on-error: true
        run: |
          SECRET=$(gcloud secrets versions access latest \
            --secret=PMP_SCHEDULER_SECRET --project="$PROJECT" 2>/dev/null || echo "")
          if [ -z "$SECRET" ]; then
            echo "::warning::PMP_SCHEDULER_SECRET não acessível — pulando a auditoria"
            exit 0
          fi
          curl -sS --max-time 300 \
            -H "X-Scheduler-Secret: $SECRET" \
            "$FN_URL?action=pmp_pubmatic_audit&days=14" | python3 -m json.tool

      # ── SONDA CRUA DA API ───────────────────────────────────────────────────

      # Quando o ledger diz `api_last_day` parado e a auditoria diz clean, a
      # base está igual à API — e a pergunta que sobra é o que a API devolve
      # LITERALMENTE pros dias que faltam (zero explícito? dia ausente? dado
      # noutra dimensão?). O runner alcança api.pubmatic.com e o Secret
      # Manager; o container de dev não alcança nenhum dos dois. Só leitura.
      - name: 'Sonda · resposta crua da API da PubMatic'
        if: inputs.sonda_api_crua
        continue-on-error: true
        run: |
          U=$(gcloud secrets versions access latest --secret=PUBMATIC_USER --project="$PROJECT")
          P=$(gcloud secrets versions access latest --secret=PUBMATIC_PASS --project="$PROJECT")
          echo "::add-mask::$U"; echo "::add-mask::$P"
          PUBMATIC_USER="$U" PUBMATIC_PASS="$P" PROBE_TIMEOUT=240 \
            PROBE_DAYS="${{ inputs.sonda_dias }}" \
            PROBE_FULL="${{ inputs.sonda_completa && '1' || '0' }}" \
            python3 backend/scripts/pubmatic_probe.py

      # ── VEREDITO ────────────────────────────────────────────────────────────

      # Veredito: o único passo do diagnóstico SEM continue-on-error. Falha o
      # job (e dispara o e-mail do GitHub na ronda agendada) quando:
      #   • há hora da grade do cron sem disparo do scheduler (cron parou);
      #   • alguma execução da PubMatic deu error/skipped nas últimas 24h
      #     (credencial/API);
      #   • a PubMatic está parada em D-2 ou pior E alguma line dela entregou
      #     nos últimos 7 dias (se nada entregou na semana, é fim de campanha,
      #     não atraso — mesma guarda do painel).
      # Só lê /tmp/status.json; se o passo anterior não conseguiu gerar o
      # arquivo, isso também é falha (diagnóstico cego é o que se quer evitar).
      - name: 'Veredito · o pipeline da PubMatic está saudável?'
        # Só nos runs de diagnóstico puro (manual ou ronda agendada). Num run de
        # deploy o veredito não roda: o status foi lido ANTES do deploy e um
        # vermelho aqui seria lido como "o deploy falhou".
        if: inputs.acao == 'diagnosticar' || github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import json, sys
          from datetime import datetime, timedelta, timezone
          try:
              d = json.load(open("/tmp/status.json"))
          except Exception as e:
              print(f"::error::sem /tmp/status.json ({e}) — o endpoint pmp_sync_status não respondeu")
              sys.exit(1)
          if "runs" not in d:
              print("::error::pmp_sync_status sem `runs`: " + json.dumps(d, ensure_ascii=False)[:400])
              sys.exit(1)
          problems = []
          ms = d.get("missing_slots") or []
          if ms:
              problems.append(f"cron: {len(ms)} hora(s) da grade sem disparo do scheduler → {ms}")
          cutoff = datetime.now(timezone.utc) - timedelta(hours=24)
          bad = [r for r in d["runs"]
                 if r.get("source") == "pubmatic" and r.get("status") in ("error", "skipped")
                 and datetime.fromisoformat(str(r["started_at"]).replace("Z", "+00:00")) >= cutoff]
          if bad:
              problems.append(f"execução: {len(bad)} run(s) da PubMatic com erro nas últimas 24h → "
                              + "; ".join(f'{r.get("quando_brt")} {r.get("status")} {r.get("error") or ""}' for r in bad[:3]))
          pm_fresh = next((r for r in d.get("delivery_freshness") or [] if r.get("source") == "pubmatic"), None)
          if pm_fresh and int(pm_fresh.get("lines_7d") or 0) > 0 and int(pm_fresh.get("dias_atras") or 0) >= 2:
              # Dois estados com a mesma cara no `dias_atras`, consertos opostos:
              #   • a API devolveu os dias que faltam como ZERO EXPLÍCITO
              #     (trailing_zero_days >= lag_days no último run OK) → a fonte
              #     fechou esses dias e reporta "sem entrega". Não é atraso de
              #     ninguém: em 01–03/09 e 08–10/09/2026 o deal da TIM não
              #     entregou nesses dias (flight por fim de semana; a sonda
              #     crua confirmou e a API nunca preencheu 01–02/09 depois).
              #     Aviso, não falha — falhar todo dia de pausa ensina a
              #     ignorar o e-mail.
              #   • a API NEM devolveu o dia (trailing_zero_days < lag_days)
              #     → aí sim é a PubMatic atrasada: falha.
              last_ok = next((r for r in d["runs"] if r.get("source") == "pubmatic"
                              and r.get("status") == "ok" and r.get("api_last_day")), None)
              tz = (last_ok or {}).get("trailing_zero_days")
              lag = (last_ok or {}).get("lag_days")
              base = (f"PubMatic: última entrega gravada em {pm_fresh.get('ultimo_dia_na_base')} "
                      f"({pm_fresh.get('dias_atras')} dias atrás de D-1), {pm_fresh.get('lines_7d')} line(s) "
                      "entregando na semana")
              if tz is not None and lag is not None and int(tz) >= int(lag):
                  print(f"::warning::{base} — a API devolve os dias que faltam com entrega ZERO "
                        "(dia fechado, sem entrega do deal). Não é atraso de report; se o comprador "
                        "diz que a line entregou nesses dias, aí é ticket com a PubMatic.")
              else:
                  problems.append(f"fonte: {base} — a API ainda não devolveu o(s) dia(s) que falta(m) "
                                  "(fonte atrasada de verdade). Se persistir depois das 11h BRT, ticket com a PubMatic "
                                  "citando /v1/analytics/data/dataprovider/74689.")
          if problems:
              for p in problems: print("::error::" + p)
              sys.exit(1)
          print("OK — cron sem buracos, sem erro nas últimas 24h, dado da PubMatic dentro do esperado")
          PY
