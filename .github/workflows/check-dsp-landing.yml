# Sonda de aterrissagem por DSP, rodando no CI.
#
# ─── POR QUE ESTE ARQUIVO EXISTE ──────────────────────────────────────
# Mesmo motivo do check-ma-survey.yml: a verificação toca BigQuery e quem
# está diagnosticando normalmente não tem acesso a ele. Em 18/09/2026 a
# pergunta "a Amazon parou porque não teve entrega ou porque a integração
# quebrou?" ficou sem resposta por isso — o painel mostra MAX(date) parado
# nos DOIS casos, e ninguém conseguia abrir o BQ pra desempatar.
#
# Roda `backend/scripts/check_dsp_landing.sh`, o MESMO script que se roda na
# mão. Uma fonte de verdade só, em vez de queries divergindo entre o runbook
# e o CI.
#
# ─── PRÉ-REQUISITO ────────────────────────────────────────────────────
# A mesma credencial GCP do deploy-backend.yml (WIF, já configurada).
# A conta precisa de bigquery.jobUser no projeto e leitura em prod_assets e
# staging. Só leitura: este workflow não altera nada.

name: Sonda de aterrissagem por DSP

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Fonte a investigar"
        required: true
        default: amazon
        type: choice
        options: [amazon, stackadapt, yahoo]

concurrency:
  group: check-dsp-landing
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Falha cedo e legível. Sem isto, a ausência de credencial vira um erro
      # de permissão do gcloud lá na frente, que manda debugar a coisa errada.
      - name: Conferir se há credencial configurada
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$WIF_PROVIDER" ] || [ -n "$SA_KEY" ]; then
            echo "Credencial presente."
          else
            echo "::error::Nenhuma credencial GCP configurada — este workflow não tem como consultar o BigQuery."
            echo "::error::Opção A: variáveis do repo GCP_WORKLOAD_IDENTITY_PROVIDER e GCP_DEPLOY_SERVICE_ACCOUNT"
            echo "::error::Opção B: secret do repo GCP_SA_KEY"
            exit 1
          fi

      - name: Autenticar no GCP (Workload Identity Federation)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Autenticar no GCP (chave de service account)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: site-hypr

      - name: Sonda
        run: bash backend/scripts/check_dsp_landing.sh "${{ inputs.source }}"
